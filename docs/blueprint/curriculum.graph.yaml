# CS Universe — Curriculum Knowledge Graph (Phase 0 blueprint draft)
#
# Hierarchy:  Universe → Domain (region) → Subject → Unit (cluster, not a camera level) → Topic (lesson)
# Topic line format:  "[*]id | Title | prereq-id, prereq-id"
#   *        = topic is on the Core Path (the recommended zero-to-foundations route)
#   id       = globally unique kebab-case id (becomes the URL slug)
#   prereqs  = hard prerequisite edges (DAG). May point into any subject/domain.
# Subject-level dependencies are DERIVED from topic edges (never hand-written).
# core_path_subjects = global order in which a beginner visits subjects; each core topic's
#   prereqs must be core topics in the same or an earlier subject (checked by validator).
# refs = canonical book-level sources for the subject; chapter/section refs are added per lesson in Phase 5+.
# This file migrates to content/graph/ in Phase 1 under a Zod schema.

version: 0.1.0

core_path_subjects:
  - information-bits
  - number-systems
  - boolean-logic
