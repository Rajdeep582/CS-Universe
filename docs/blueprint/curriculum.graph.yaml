domains:
  # ───────────────────────────────────────── TIER 0
  - id: origins
    title: Origins
    tagline: How computers think
    color: "#F2C46D"
    subjects:
      - id: information-bits
        title: Information & Bits
        tier: 0
        refs: ["Petzold — Code, 2nd ed.", "Bryant & O'Hallaron — CS:APP 3e, ch. 2"]
        boss: "Signal Decoder — turn a raw mystery bitstream into a message by choosing the right unit and grouping."
        units:
          - title: The Big Picture
            topics:
              - "*what-is-computer | What Is a Computer? |"
              - "*abstraction-layers | Layers of Abstraction | what-is-computer"
          - title: Information
            topics:
              - "*information-idea | Information as Distinguishable States | what-is-computer"
              - "*bits | The Bit | information-idea"
              - "*bytes-words | Bytes, Words & Units (kB vs KiB) | bits"
              - "info-entropy-intro | Measuring Information (Shannon, intro) | bits"

      - id: number-systems
        title: Number Systems & Arithmetic
        tier: 0
        refs: ["Bryant & O'Hallaron — CS:APP 3e, ch. 2", "Patterson & Hennessy — COD RISC-V 2e, ch. 3"]
        boss: "The Calculator Core — predict results and overflow flags for a mixed run of two's-complement and IEEE 754 operations."
        units:
          - title: Positional Systems
            topics:
              - "*positional-notation | Positional Number Systems | bits"
              - "*binary-numbers | Binary Numbers | positional-notation"
              - "*base-conversion | Converting Between Bases | binary-numbers"
              - "*hex-octal | Hexadecimal & Octal | base-conversion"
          - title: Integer Arithmetic
            topics:
              - "*binary-addition | Binary Addition & Carries | binary-numbers"
              - "*signed-numbers | Sign-Magnitude, One's & Two's Complement | binary-addition"
              - "*overflow | Fixed Width & Overflow | signed-numbers"
              - "binary-mult-div | Binary Multiplication & Division | binary-addition"
              - "shifts | Logical & Arithmetic Shifts | signed-numbers"
          - title: Real Numbers
            topics:
              - "*fixed-point | Fixed-Point Numbers | signed-numbers"
              - "*floating-point | IEEE 754 Floating Point | fixed-point, overflow"
              - "float-pitfalls | Floating-Point Pitfalls: Rounding, NaN, Epsilon | floating-point"

      - id: boolean-logic
        title: Boolean Logic
        tier: 0
        refs: ["Harris & Harris — Digital Design and Computer Architecture, RISC-V ed., ch. 2", "Petzold — Code, 2nd ed."]
        boss: "Gatekeeper — derive and minimize an expression from a truth table, then build it from NAND gates only."
