              - "*karnaugh-maps | Karnaugh Map Simplification | normal-forms"
              - "*universal-gates | NAND & NOR Universality | de-morgan"

      - id: data-representation
        title: Encoding Text & Media
        tier: 0
        refs: ["The Unicode Standard (current version), ch. 2–3", "RFC 3629 — UTF-8", "Bryant & O'Hallaron — CS:APP 3e, ch. 2"]
        boss: "Babel Packet — decode a byte dump holding UTF-8 text, a little-endian integer and a parity-checked header."
