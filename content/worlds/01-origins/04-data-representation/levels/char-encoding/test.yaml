items:
  - id: what-is
    type: mcq
    teaches: intuition-table
    prompt: What is a character encoding?
    options:
      - A font
      - An agreed table mapping numbers to characters
      - A compression method
      - A keyboard layout
    answer: 1
    explain: Sender and receiver must share the same table.

  - id: ascii-bits
    type: numeric
    teaches: formal-ascii
    prompt: How many characters does 7-bit ASCII define?
    answer: 128
    explain: 2^7 = 128.

  - id: code-cap-a
    type: numeric
    teaches: formal-ascii
    prompt: What is the ASCII code of 'A' in decimal?
    answer: 65
    explain: 'A is 0x41 = 65.'

  - id: ranges
    type: match
    teaches: formal-ascii
    prompt: Match each range to its contents.
    pairs:
      - left: 48–57
        right: Digits 0–9
      - left: 65–90
        right: Capital letters
      - left: 97–122
        right: Lower-case letters
      - left: 0–31
        right: Control codes
    explain: The layout of the ASCII table.

  - id: case-bit
    type: mcq
    teaches: formal-structure
    prompt: Which bit distinguishes 'A' (0100 0001) from 'a' (0110 0001)?
    options:
      - Bit 0 (value 1)
      - Bit 5 (value 32)
      - Bit 7 (value 128)
      - Bit 3 (value 8)
    answer: 1
    explain: Lower case = upper case + 32.

  - id: digit-value
    type: numeric
    teaches: formal-structure
    prompt: The character '9' has code 57. What do you subtract to get the digit's value?
    answer: 48
    explain: "'0' is 48, so value = code − 48."

  - id: encode-ascii
    type: mcq
    teaches: mechanism-encode
    prompt: How many bytes does the ASCII text "ASCII" take?
    options:
      - '1'
      - '5'
      - '7'
      - '10'
    answer: 1
    explain: One byte per character.

  - id: decode
    type: mcq
    teaches: worked-example
    prompt: Which word do the hex bytes 43 61 74 spell? (0x41 = 'A', 0x61 = 'a')
    options:
      - Cat
      - cAT
      - Bat
      - Car
    answer: 0
    explain: 0x43 = 'C', 0x61 = 'a', 0x74 = 't'.

  - id: text-vs-int
    type: mcq
    teaches: worked-example
    prompt: How many bytes does the number 42 take when stored as ASCII text?
    options:
      - '1'
      - '2'
      - '4'
      - '42'
    answer: 1
    explain: Two characters, '4' and '2'.

  - id: limits
    type: mcq
    teaches: tradeoffs
    prompt: What was the main problem with 8-bit "extended ASCII"?
    options:
      - It used too much memory
      - Many incompatible code pages used the upper 128 values differently
      - It could not store English
      - It had no digits
    answer: 1
    explain: The same byte meant different letters in different code pages.

  - id: line-endings
    type: match
    teaches: pitfalls
    prompt: Match each system to its line ending.
    pairs:
      - left: Unix / Linux / macOS
        right: LF (10)
      - left: Windows
        right: CR LF (13 10)
      - left: Classic Mac OS
        right: CR (13)
    explain: A frequent source of diff noise and parsing bugs.
