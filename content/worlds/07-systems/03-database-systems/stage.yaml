        core: true
        requires: [relational-algebra, indexing-basics]
      - id: external-sorting
        title: External Merge Sort
        core: false
        requires: [merge-sort, storage-pages]
      - id: join-algorithms
        title: "Join Algorithms: Nested-Loop, Hash & Sort-Merge"
        core: true
        requires: [query-processing, merge-sort]
      - id: query-optimization
        title: "Query Optimization & Cost Estimation"
        core: false
        requires: [join-algorithms]
  - id: transactions
