    title: The Relational Model
    levels:
      - id: why-databases
        title: "Why Databases? Data Models & the DBMS"
        core: true
        requires: [file-concept, sets]
      - id: relational-model
        title: "Relations, Keys & Schemas"
        core: true
        requires: [why-databases, relations]
      - id: relational-algebra
        title: Relational Algebra
        core: true
        requires: [relational-model]
  - id: sql
    title: SQL
    levels:
      - id: sql-basics
        title: "SQL: SELECT, WHERE, ORDER BY"
        core: true
        requires: [relational-algebra]
      - id: sql-joins
        title: SQL Joins
        core: true
        requires: [sql-basics]
      - id: sql-aggregation
        title: "Aggregation & GROUP BY"
        core: true
        requires: [sql-basics]
      - id: sql-subqueries
        title: "Subqueries & Set Operations"
        core: false
        requires: [sql-joins]
      - id: sql-nulls
        title: "NULLs & Three-Valued Logic"
        core: false
        requires: [sql-basics]
      - id: sql-ddl-constraints
        title: "DDL & Integrity Constraints"
        core: false
        requires: [sql-basics]
      - id: sql-window
        title: Window Functions
        core: false
        requires: [sql-aggregation]
      - id: views
        title: Views
        core: false
        requires: [sql-subqueries]
  - id: design
    title: Design
    levels:
      - id: er-modeling
