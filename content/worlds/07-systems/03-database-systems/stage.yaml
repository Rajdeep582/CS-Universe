      - id: mvcc
        title: "MVCC & Snapshot Isolation"
        core: false
        requires: [isolation-levels]
      - id: timestamp-ordering
        title: "Timestamp Ordering & Optimistic Concurrency"
        core: false
        requires: [schedules-serializability]
  - id: recovery
    title: Recovery
    levels:
      - id: logging-recovery
        title: "Logging & Write-Ahead Logging"
        core: true
        requires: [transactions-acid, storage-pages]
      - id: aries
        title: ARIES Recovery
        core: false
        requires: [logging-recovery]
  - id: beyond-relational
    title: Beyond Relational
    levels:
      - id: nosql-models
