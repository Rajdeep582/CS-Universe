        core: true
        requires: [relational-model]
      - id: functional-dependencies
        title: Functional Dependencies
        core: true
        requires: [relational-model, functions]
      - id: normalization
        title: "Normal Forms: 1NF to BCNF"
        core: true
        requires: [functional-dependencies]
      - id: decomposition
        title: "Lossless Decomposition & Dependency Preservation"
        core: false
        requires: [normalization]
  - id: storage-indexing
    title: "Storage & Indexing"
    levels:
      - id: storage-pages
        title: "Disk Storage, Pages & Records"
        core: true
        requires: [why-databases, memory-hierarchy]
      - id: buffer-pool
        title: Buffer Pool Management
        core: false
        requires: [storage-pages, page-replacement]
      - id: indexing-basics
