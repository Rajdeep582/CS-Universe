# World 7 · Stage 3 — Database Systems
id: database-systems
order: 3
title: Database Systems
tier: 3
refs:
  - "Silberschatz, Korth & Sudarshan — Database System Concepts 7e"
  - "Ramakrishnan & Gehrke — Database Management Systems 3e"
  - Mohan et al. (1992) — ARIES
boss:
  title: Bank on It
  description: "Design the schema, write queries, choose indexes and an isolation level for a banking workload, then survive a crash."
units:
